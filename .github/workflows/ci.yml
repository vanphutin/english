name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://english:english@localhost:5432/english?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: english
          POSTGRES_PASSWORD: english
          POSTGRES_DB: english
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U english -d english"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guidelines:verify
      - run: pnpm contracts:validate
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Show CF3 Prettier diff without changing the checkout
        run: |
          pnpm exec prettier --write modules/operations/src/content-factory/cf3-pilot.service.ts modules/operations/src/content-factory/cf3-pilot.service.spec.ts
          git diff -- modules/operations/src/content-factory/cf3-pilot.service.ts modules/operations/src/content-factory/cf3-pilot.service.spec.ts
          git checkout -- modules/operations/src/content-factory/cf3-pilot.service.ts modules/operations/src/content-factory/cf3-pilot.service.spec.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
